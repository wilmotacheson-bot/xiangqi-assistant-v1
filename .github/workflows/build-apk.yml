name: Build Xiangqi Assistant v1.0.28 v1.0.21 S23 Midgame Lock

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.0.4 source baseline
        run: |
          cat source_v104/chunk_00a.b64 source_v104/chunk_00b.b64 source_v104/chunk_01.b64 source_v104/chunk_02.b64 source_v104/chunk_03.b64 source_v104/chunk_04.b64 source_v104/chunk_05.b64 source_v104/chunk_06.b64 | base64 -d > baseline.zip
          echo "1a284d8c74122a3c53f3b8c2780c90690333a88b00420a57e74294be178a4e94  baseline.zip" | sha256sum -c -
          unzip -t baseline.zip
          rm -rf app
          unzip -o baseline.zip -d .
          sed -i "s/applicationId 'com.openai.xiangqiassist.compat'/applicationId 'com.openai.xiangqiassist.v119'/" app/build.gradle
          sed -E -i "s/versionCode [0-9]+/versionCode 119/" app/build.gradle
          sed -E -i "s/versionName '[^']+'/versionName '1.0.19-strong-fast'/" app/build.gradle
          sed -i 's/android:label="象棋助手 v1"/android:label="象棋助手 1.0.19 强快双模式版"/' app/src/main/AndroidManifest.xml

      - name: Patch resilient Pikafish runtime
        run: |
          cat > app/src/main/java/com/openai/xiangqiassist/PikafishEngine.java <<'JAVA'
          package com.openai.xiangqiassist;

          import android.content.Context;

          import java.io.*;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.concurrent.BlockingQueue;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          final class PikafishEngine implements Closeable {
              static final class Result {
                  final String bestMove;
                  final int scoreCp;
                  final int depth;
                  final String error;
                  Result(String bestMove, int scoreCp, int depth, String error) {
                      this.bestMove = bestMove; this.scoreCp = scoreCp; this.depth = depth; this.error = error;
                  }
                  static Result err(String e) { return new Result("", 0, 0, e); }
              }

              private final Context context;
              private final Object lifecycleLock = new Object();
              private final Object tailLock = new Object();
              private volatile Process process;
              private volatile BufferedWriter writer;
              private final BlockingQueue<String> lines = new LinkedBlockingQueue<>();
              private final ArrayDeque<String> tail = new ArrayDeque<>();
              private volatile Thread readerThread;
              private volatile boolean ready;
              private volatile long startedAtMs;
              private static final Pattern DEPTH = Pattern.compile("\\bdepth\\s+(\\d+)");
              private static final Pattern SCORE_CP = Pattern.compile("\\bscore\\s+cp\\s+(-?\\d+)");
              private static final Pattern SCORE_MATE = Pattern.compile("\\bscore\\s+mate\\s+(-?\\d+)");

              PikafishEngine(Context c) { context = c.getApplicationContext(); }

              boolean isReady() {
                  Process p = process;
                  return ready && p != null && p.isAlive() && writer != null;
              }

              void warmUp() {
                  if (isReady()) return;
                  try { ensureStarted(); }
                  catch (Throwable t) { closeQuietly(); }
              }

              Result analyze(String fen, int moveTimeMs) {
                  if (!isReady()) return Result.err("Pikafish 尚未就绪");
                  try {
                      return analyzeOnce(fen, moveTimeMs);
                  } catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                      return Result.err("Pikafish 任务已取消");
                  } catch (Throwable t) {
                      String msg = describe(t) + diagnosticSuffix();
                      closeQuietly();
                      return Result.err(msg);
                  }
              }

              private Result analyzeOnce(String fen, int moveTimeMs) throws Exception {
                  if (!isReady()) throw new IOException("引擎未就绪");
                  drain();
                  send("position fen " + fen);
                  int thinkMs = Math.max(250, Math.min(4500, moveTimeMs));
                  send("go movetime " + thinkMs);

                  long end = System.currentTimeMillis() + thinkMs + 350L;
                  int cp = 0, depth = 0;
                  while (System.currentTimeMillis() < end) {
                      if (Thread.currentThread().isInterrupted()) throw new InterruptedException();
                      Process p = process;
                      if (p == null || !p.isAlive()) throw new IOException("引擎进程已退出" + exitSuffix());
                      String line = lines.poll(80, TimeUnit.MILLISECONDS);
                      if (line == null) continue;
                      if (line.startsWith("info ")) {
                          Matcher d = DEPTH.matcher(line); if (d.find()) depth = Integer.parseInt(d.group(1));
                          Matcher c = SCORE_CP.matcher(line); if (c.find()) cp = Integer.parseInt(c.group(1));
                          Matcher m = SCORE_MATE.matcher(line); if (m.find()) cp = Integer.parseInt(m.group(1)) > 0 ? 30000 : -30000;
                      } else if (line.startsWith("bestmove ")) {
                          String[] p2 = line.trim().split("\\s+");
                          if (p2.length < 2 || p2[1].equals("(none)")) return Result.err("当前局面无可用着法");
                          return new Result(p2[1], cp, depth, null);
                      } else if (line.contains("CRITICAL ERROR")) {
                          throw new IOException(line);
                      }
                  }

                  try { send("stop"); } catch (Throwable ignored) {}
                  long stopEnd = System.currentTimeMillis() + 300L;
                  while (System.currentTimeMillis() < stopEnd) {
                      String line = lines.poll(50, TimeUnit.MILLISECONDS);
                      if (line != null && line.startsWith("bestmove ")) {
                          String[] p2 = line.trim().split("\\s+");
                          if (p2.length >= 2 && !p2[1].equals("(none)")) return new Result(p2[1], cp, depth, null);
                      }
                  }
                  throw new IOException("本步计算超过硬时限");
              }

              private void ensureStarted() throws Exception {
                  synchronized (lifecycleLock) {
                      if (isReady()) return;
                      closeQuietlyLocked();

                      File binary = new File(context.getApplicationInfo().nativeLibraryDir, "libpikafish.so");
                      if (!binary.exists() || binary.length() < 100000) {
                          throw new FileNotFoundException("APK 内 Pikafish 引擎文件缺失");
                      }
                      File net = ensureNetwork();

                      ProcessBuilder pb = new ProcessBuilder(binary.getAbsolutePath());
                      pb.redirectErrorStream(true);
                      pb.directory(context.getFilesDir());
                      Process newProcess = pb.start();
                      process = newProcess;
                      startedAtMs = System.currentTimeMillis();
                      writer = new BufferedWriter(new OutputStreamWriter(newProcess.getOutputStream(), StandardCharsets.UTF_8));
                      readerThread = new Thread(() -> {
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(newProcess.getInputStream(), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = br.readLine()) != null) {
                                  lines.offer(line);
                                  remember(line);
                              }
                          } catch (IOException ignored) {}
                      }, "pikafish-reader");
                      readerThread.setDaemon(true);
                      readerThread.start();

                      send("uci");
                      if (!waitFor("uciok", 7000)) throw new IOException("启动等待 uciok 超时" + exitSuffix() + diagnosticSuffix());
                      send("setoption name Threads value 2");
                      send("setoption name Hash value 32");
                      send("setoption name EvalFile value " + net.getAbsolutePath());
                      send("isready");
                      if (!waitFor("readyok", 15000)) throw new IOException("NNUE 加载/ready 超时" + exitSuffix() + diagnosticSuffix());
                      send("ucinewgame");
                      send("isready");
                      if (!waitFor("readyok", 4000)) throw new IOException("新局初始化超时" + exitSuffix() + diagnosticSuffix());
                      ready = true;
                      drain();
                  }
              }

              private File ensureNetwork() throws IOException {
                  File out = new File(context.getFilesDir(), "pikafish.nnue");
                  if (out.exists() && out.length() > 1024 * 1024) return out;
                  File tmp = new File(context.getFilesDir(), "pikafish.nnue.tmp");
                  if (tmp.exists()) tmp.delete();
                  try (InputStream in = context.getAssets().open("pikafish.nnue");
                       OutputStream os = new BufferedOutputStream(new FileOutputStream(tmp))) {
                      byte[] buf = new byte[1024 * 1024];
                      int n;
                      while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                      os.flush();
                  } catch (FileNotFoundException e) {
                      throw new FileNotFoundException("APK 内缺少 pikafish.nnue");
                  }
                  if (out.exists() && !out.delete()) throw new IOException("旧 NNUE 无法替换");
                  if (!tmp.renameTo(out)) throw new IOException("NNUE 文件写入失败");
                  return out;
              }

              private void send(String s) throws IOException {
                  BufferedWriter w = writer;
                  if (w == null) throw new IOException("engine stdin closed");
                  w.write(s);
                  w.newLine();
                  w.flush();
              }

              private boolean waitFor(String token, long ms) throws InterruptedException {
                  long end = System.currentTimeMillis() + ms;
                  while (System.currentTimeMillis() < end) {
                      if (Thread.currentThread().isInterrupted()) throw new InterruptedException();
                      Process p = process;
                      if (p == null || !p.isAlive()) return false;
                      String line = lines.poll(100, TimeUnit.MILLISECONDS);
                      if (line == null) continue;
                      if (line.equals(token) || line.startsWith(token + " ")) return true;
                      if (line.contains("CRITICAL ERROR")) return false;
                  }
                  return false;
              }

              private void remember(String line) {
                  if (line == null || line.isEmpty()) return;
                  synchronized (tailLock) {
                      if (tail.size() >= 6) tail.removeFirst();
                      tail.addLast(line.length() > 180 ? line.substring(0, 180) : line);
                  }
              }

              private String diagnosticSuffix() {
                  synchronized (tailLock) {
                      if (tail.isEmpty()) return "";
                      String last = tail.peekLast();
                      if (last == null || last.startsWith("info ")) return "";
                      return " · " + last;
                  }
              }

              private String exitSuffix() {
                  try {
                      Process p = process;
                      if (p != null && !p.isAlive()) return " (exit=" + p.exitValue() + ")";
                  } catch (Throwable ignored) {}
                  long age = startedAtMs > 0 ? System.currentTimeMillis() - startedAtMs : 0;
                  return age > 0 ? " (运行 " + age + "ms)" : "";
              }

              private static String describe(Throwable t) {
                  String m = t.getMessage();
                  return t.getClass().getSimpleName() + (m == null || m.isEmpty() ? "" : ": " + m);
              }

              private void drain() { lines.clear(); }

              @Override public void close() { closeQuietly(); }

              private void closeQuietly() {
                  synchronized (lifecycleLock) { closeQuietlyLocked(); }
              }

              private void closeQuietlyLocked() {
                  ready = false;
                  BufferedWriter w = writer;
                  Process p = process;
                  try { if (w != null && p != null && p.isAlive()) { w.write("quit\n"); w.flush(); } } catch (Throwable ignored) {}
                  try {
                      if (p != null && p.isAlive()) {
                          p.destroy();
                          try { p.waitFor(300, TimeUnit.MILLISECONDS); } catch (Throwable ignored) {}
                          if (p.isAlive()) p.destroyForcibly();
                      }
                  } catch (Throwable ignored) {}
                  writer = null;
                  process = null;
                  readerThread = null;
                  startedAtMs = 0L;
                  lines.clear();
              }
          }
          JAVA

          cat > app/src/main/java/com/openai/xiangqiassist/EngineBridge.java <<'JAVA'
          package com.openai.xiangqiassist;

          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import org.json.JSONObject;

          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.ThreadPoolExecutor;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;

          final class EngineBridge {
              private final WebView webView;
              private final PikafishEngine engine;
              private final ThreadPoolExecutor worker = new ThreadPoolExecutor(
                      1, 1, 0L, TimeUnit.MILLISECONDS, new LinkedBlockingQueue<>());
              private final AtomicInteger latestRequest = new AtomicInteger(-1);

              EngineBridge(WebView webView, PikafishEngine engine) {
                  this.webView = webView;
                  this.engine = engine;
                  worker.execute(engine::warmUp);
              }

              private void deliver(int requestId, PikafishEngine.Result r) {
                  if (latestRequest.get() != requestId) return;
                  String js = "window.onEngineResult(" + requestId + "," +
                          JSONObject.quote(r.bestMove) + "," + r.scoreCp + "," + r.depth + "," +
                          JSONObject.quote(r.error == null ? "" : r.error) + ")";
                  webView.post(() -> {
                      if (latestRequest.get() == requestId) webView.evaluateJavascript(js, null);
                  });
              }

              @JavascriptInterface
              public boolean isReady() {
                  return engine.isReady();
              }

              @JavascriptInterface
              public synchronized void analyze(String fen, int requestId, int moveTimeMs) {
                  latestRequest.set(requestId);
                  if (!engine.isReady()) {
                      deliver(requestId, PikafishEngine.Result.err("Pikafish 尚未就绪"));
                      return;
                  }
                  worker.getQueue().clear();
                  worker.submit(() -> deliver(requestId, engine.analyze(fen, moveTimeMs)));
              }

              @JavascriptInterface
              public synchronized void resetEngine() {
                  worker.getQueue().clear();
                  worker.execute(() -> {
                      engine.close();
                      engine.warmUp();
                  });
              }

              @JavascriptInterface
              public synchronized void warmUp() {
                  if (!engine.isReady()) worker.execute(engine::warmUp);
              }

              void close() {
                  latestRequest.set(-1);
                  worker.shutdownNow();
                  engine.close();
              }
          }
          JAVA

          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/overlay.html')
          s=p.read_text()
          s=s.replace("reject(new Error('Pikafish 返回超时'))}},9000)",
                      "try{if(window.AndroidEngine&&AndroidEngine.resetEngine)AndroidEngine.resetEngine()}catch(_){}reject(new Error('Pikafish 响应超时，已自动重启'))}},18000)")
          s=s.replace("showStatus('Pikafish 暂不可用',e&&e.message?e.message:String(e))",
                      "showStatus('Pikafish 正在自愈',e&&e.message?e.message+' · 稍后会自动重试':String(e))")
          s=s.replace("showStatus('象棋助手 v1.0.4 已启动','自动识别红黑方 · 白圈判断上一手/当前回合 · 正在寻找棋盘…');",
                      "showStatus('象棋助手 v1.0.5 引擎自愈版','Pikafish 已预热 · 卡死自动重启 · 自动识别红黑方/白圈');")
          p.write_text(s)
          PY
          python scripts/patch_v106.py
          python scripts/patch_v107.py
          python scripts/patch_v109.py
          python scripts/patch_v110.py
          python scripts/patch_v111.py
          python scripts/patch_v112.py
          python scripts/patch_v113.py
          python scripts/patch_v113_java.py
          python scripts/patch_v114.py
          python scripts/patch_v115.py
          python scripts/patch_v116.py
          python scripts/patch_v117.py
          python scripts/patch_v118.py
          python scripts/patch_v119.py
          python scripts/patch_v121.py
          python scripts/patch_v127.py
          python scripts/patch_v128.py

      - name: Validate v1.0.19 strong/fast modes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          svc=Path('app/src/main/java/com/openai/xiangqiassist/ChessAccessibilityService.java').read_text()
          eb=Path('app/src/main/java/com/openai/xiangqiassist/EngineBridge.java').read_text()
          ov=Path('app/src/main/assets/overlay.html').read_text()
          checks = {
              "v118 fixed glyph source retained": "user-red-black-opening-screens" in ov,
              "fixed bank still 14 classes": "FIXED_GLYPH_ORDER=['K','A','B','N','R','C','P','k','a','b','n','r','c','p']" in ov,
              "startup current-position takeover retained": "启动即按当前棋盘作为新残局" in Path('scripts/patch_v118.py').read_text(),
              "mode query parsed": "const ANALYSIS_MODE=" in ov,
              "strong mode retains original budget": "function boundedThinkMs(pos,red,legal)" in ov and "return 4500" in ov,
              "fast dynamic budget": "function fastThinkMs(pos,red,legal)" in ov and "FAST_ENGINE_BUDGET_MS=115000" in ov,
              "fast hard cap 4 seconds": "Math.min(4000,base)" in ov,
              "fast cumulative pressure": "fastSpentMs" in ov and "fastSearches" in ov,
              "selected think policy": "selectedThinkMs(analysisBoard,userRed,legal)" in ov,
              "native floating mode chooser": 'modeChip("强"' in svc and 'modeChip("快"' in svc,
              "mode persisted": 'putString("analysis_mode", value)' in svc,
              "last mode highlighted": 'String current = analysisMode()' in svc,
              "mode selector hidden during screenshot": "modePanel.setVisibility(View.INVISIBLE)" in svc,
              "mode switch invalidates old engine result": "engineBridge.newSession()" in svc,
              "overlay url carries mode": '"&mode=" + analysisMode()' in svc,
              "check latch retained": "checkHandledHash!==checkHash" in ov,
              "no green-frame turn logic": "function detectUiTurn(){return null}" in ov,
              "v119 title": "象棋助手 1.0.19 强/快双模式" in ov,
              "v127 based on v121 only": "1.0.27-v121-s23-geometry" in Path('app/build.gradle').read_text(),
              "v127 S23 grid geometry": "const SKIN_S23={x:0.07486034,y:0.24947917,w:0.85139665,h:0.44531250}" in ov,
              "v127 vertical grid-line fitter": "function fitS23YOffset()" in ov and "function s23GridScore" in ov,
              "v127 live layout recheck": "s23ProbeTick%8" in ov,
              "v128 impossible occupancy guard": "hi.length<2||hi.length>32" in ov,
              "v128 startup refits every frame": "if(currentBoard&&s23ProbeTick>1&&s23ProbeTick%8!==0)return" in ov,
              "v128 occupancy separation score": "function s23OccupancyGeometryScore" in ov and "sep=minHi-maxLo" in ov,
              "later S23 glyph bank intentionally not applied": "S23_GLYPH_B64" not in ov,
          }
          m=re.search(r"FIXED_GLYPH_B64='([^']+)'",ov)
          checks["fixed bank still decodes 14x400"]=bool(m) and len(base64.b64decode(m.group(1)))==5600
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(("OK  " if v else "FAIL")+" "+k)
          if failed: raise SystemExit("Validation failed: "+", ".join(failed))
          a=ov.index("<script>")+8
          b=ov.rindex("</script>")
          Path("/tmp/overlay-v119.js").write_text(ov[a:b])
          PY
          node --check /tmp/overlay-v119.js

      - uses: actions/upload-artifact@v4
        with:
          name: generated-v128-v121-s23-source
          path: |
            app/src/main/assets/overlay.html
            app/src/main/java/com/openai/xiangqiassist/ChessAccessibilityService.java
          if-no-files-found: error

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build official Pikafish Android arm64
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/Pikafish
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$ANDROID_NDK_BIN:$PATH"
          export ARCH=arm64-universal
          export COMP=ndk
          export EXE=Pikafish-Android-arm64-universal
          export LDFLAGS="-static -Wno-unused-command-line-argument"
          cd /tmp/Pikafish/src
          make -j4 build EXE="$EXE"
          make strip EXE="$EXE"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$EXE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpikafish.so"

      - name: Download official Pikafish NNUE
        run: |
          curl -fL --retry 3 https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue -o app/src/main/assets/pikafish.nnue
          test "$(stat -c%s app/src/main/assets/pikafish.nnue)" -gt 1000000

      - name: Smoke-test packaged ARM64 Pikafish + NNUE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          python - <<'PY'
          import os, subprocess, select, time, sys
          root=os.environ["GITHUB_WORKSPACE"]
          exe=os.path.join(root,"app/src/main/jniLibs/arm64-v8a/libpikafish.so")
          net=os.path.join(root,"app/src/main/assets/pikafish.nnue")
          p=subprocess.Popen(["qemu-aarch64",exe],cwd=os.path.dirname(net),
              stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
              text=True,bufsize=1)
          log=[]
          def send(x):
              p.stdin.write(x+"\n"); p.stdin.flush()
          def wait_for(prefix, timeout):
              end=time.time()+timeout
              while time.time()<end:
                  if p.poll() is not None:
                      raise SystemExit("Pikafish exited early: %s\n%s"%(p.returncode,"\n".join(log[-30:])))
                  r,_,_=select.select([p.stdout],[],[],0.25)
                  if not r: continue
                  line=p.stdout.readline().strip()
                  if not line: continue
                  log.append(line)
                  if line==prefix or line.startswith(prefix+" "): return line
              raise SystemExit("Timeout waiting for %s\n%s"%(prefix,"\n".join(log[-30:])))
          send("uci"); wait_for("uciok",30)
          send("setoption name Threads value 2")
          send("setoption name Hash value 32")
          send("setoption name EvalFile value "+net)
          send("isready"); wait_for("readyok",40)
          fens=[
              "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1",
              "rnbakabnr/9/1c5c1/p1p1p1p1p/9/2P6/P3P1P1P/1C5C1/9/RNBAKABNR b - - 0 1",
              "r1bakabnr/4n4/1c5c1/p1p1p1p1p/9/2P6/P3P1P1P/1C2C4/9/RNBAKABNR w - - 0 1",
          ]
          for i,fen in enumerate(fens,1):
              send("position fen "+fen)
              send("go movetime 350")
              bm=wait_for("bestmove",20)
              if len(bm.split())<2 or bm.split()[1]=="(none)":
                  raise SystemExit("No usable bestmove on search %d: %s"%(i,bm))
              print("ARM64 Pikafish sequential search %d OK:"%i,bm)
          send("quit")
          try: p.wait(timeout=3)
          except subprocess.TimeoutExpired: p.kill()
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Align, sign and verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app-release-aligned.apk
          OUT=xiangqi-assistant-v1.0.28-v121-s23-midgame-lock.apk
          "$BT/zipalign" -p -f 4 "$IN" "$ALIGNED"
          keytool -genkeypair -v -keystore release.keystore -storepass changeit -keypass changeit -alias xiangqi-v119 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Xiangqi Assistant v1.0.19,O=Local Build,C=US"
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias xiangqi-v119 --ks-pass pass:changeit --key-pass pass:changeit --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$OUT" "$ALIGNED"
