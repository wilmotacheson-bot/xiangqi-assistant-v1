name: Build Xiangqi Assistant v1.0.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Inspect engine source
        run: |
          unzip -t xiangqi-project-src-v104.zip
          rm -rf app
          unzip -o xiangqi-project-src-v104.zip -d .
          echo '===== PikafishEngine.java ====='
          cat app/src/main/java/com/openai/xiangqiassist/PikafishEngine.java
          echo '===== EngineBridge.java ====='
          cat app/src/main/java/com/openai/xiangqiassist/EngineBridge.java
          echo '===== analyzeCurrent excerpt ====='
          grep -n -A35 -B8 "function analyzeCurrent" app/src/main/assets/overlay.html || true
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3             https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip             -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build official Pikafish Android arm64
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git /tmp/Pikafish
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$ANDROID_NDK_BIN:$PATH"
          export ARCH=arm64-universal
          export COMP=ndk
          export EXE=Pikafish-Android-arm64-universal
          export LDFLAGS="-static -Wno-unused-command-line-argument"
          cd /tmp/Pikafish/src
          make -j4 build EXE="$EXE"
          make strip EXE="$EXE"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$EXE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpikafish.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpikafish.so"

      - name: Download official Pikafish NNUE
        run: |
          curl -fL --retry 3             https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue             -o app/src/main/assets/pikafish.nnue
          test "$(stat -c%s app/src/main/assets/pikafish.nnue)" -gt 1000000
          mkdir -p app/src/main/assets/licenses
          cp /tmp/Pikafish/Copying.txt app/src/main/assets/licenses/Pikafish-GPLv3.txt
          printf '%s\n' 'Pikafish source: https://github.com/official-pikafish/Pikafish' > app/src/main/assets/licenses/Pikafish-source.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Align and sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app-release-aligned.apk
          OUT=xiangqi-assistant-v1.0.4-auto-turn.apk
          "$BT/zipalign" -p -f 4 "$IN" "$ALIGNED"
          keytool -genkeypair -v             -keystore release.keystore             -storepass changeit             -keypass changeit             -alias xiangqi-v104             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Xiangqi Assistant v1.0.4,O=Local Build,C=US"
          "$BT/apksigner" sign             --ks release.keystore             --ks-key-alias xiangqi-v104             --ks-pass pass:changeit             --key-pass pass:changeit             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --v4-signing-enabled false             --out "$OUT" "$ALIGNED"

      - name: Verify v1.0.4 APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=xiangqi-assistant-v1.0.4-auto-turn.apk
          unzip -t "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libpikafish.so'
          unzip -l "$APK" | grep 'assets/pikafish.nnue'
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='com.openai.xiangqiassist.autoturn'" apk-badging.txt
          grep "versionCode='104'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xiangqi-assistant-v1.0.4-auto-turn-apk
          path: |
            xiangqi-assistant-v1.0.4-auto-turn.apk
            apk-sha256.txt
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
